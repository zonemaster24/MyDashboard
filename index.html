<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <title>My Dashboard</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #edf2f7;
    }

    body {
      overflow: hidden;
    }


    /* ==============================
       LOGIN SCREEN
       ============================== */

    #login-screen {
      width: 100%;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #edf2f7;
    }


    .login-card {

      background: #ffffff;

      width: 380px;
      max-width: 90%;

      padding: 40px;
      padding-top: 105px;

      border-radius: 18px;

      text-align: center;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.12);

      position: relative;
    }


    .login-banner {

      position: absolute;

      width: 150px;
      height: 150px;

      left: 50%;
      top: -75px;

      transform: translateX(-50%);

      object-fit: cover;

      border-radius: 50%;

      border: 5px solid #ffffff;

      box-shadow:
        0 6px 20px rgba(0, 0, 0, 0.18);
    }


    .login-card h2 {

      margin: 0 0 10px;

      color: #1a202c;

      font-size: 25px;

      font-weight: 600;
    }


    .login-card p {

      margin: 0 0 20px;

      color: #718096;

      font-size: 15px;

      line-height: 1.5;
    }


    #user-email {

      display: none;

      margin-bottom: 20px;

      padding: 10px;

      background: #f7fafc;

      border-radius: 8px;

      color: #4a5568;

      font-size: 14px;

      word-break: break-all;
    }


    #login-button {

      width: 100%;

      padding: 14px 20px;

      border: none;

      border-radius: 8px;

      background: #4285f4;

      color: white;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

      transition: 0.2s;
    }


    #login-button:hover {

      background: #357ae8;

      transform: translateY(-1px);
    }


    #login-button:disabled {

      background: #a0aec0;

      cursor: not-allowed;

      transform: none;
    }


    #status {

      margin-top: 15px;

      font-size: 13px;

      color: #718096;
    }


    #error {

      display: none;

      margin-top: 15px;

      padding: 10px;

      border-radius: 7px;

      background: #fff5f5;

      color: #c53030;

      font-size: 13px;
    }


    /* ==============================
       DASHBOARD
       ============================== */

    #dashboard {

      display: none;

      width: 100%;
      height: 100vh;

      overflow: hidden;
    }


    .dashboard-header {

      height: 60px;

      background: #1a365d;

      color: white;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 20px;
    }


    .dashboard-title {

      font-size: 20px;

      font-weight: 600;
    }


    .logged-user {

      font-size: 13px;

      opacity: 0.9;
    }


    .dashboard-body {

      display: flex;

      width: 100%;

      height: calc(100vh - 60px);
    }


    /* ==============================
       LEFT MENU
       ============================== */

    .sidebar {

      width: 230px;

      min-width: 230px;

      background: #ffffff;

      border-right: 1px solid #e2e8f0;

      padding: 15px 10px;

      overflow-y: auto;
    }


    .menu-title {

      font-size: 11px;

      font-weight: 700;

      color: #a0aec0;

      padding: 10px;

      text-transform: uppercase;

      letter-spacing: 1px;
    }


    .menu-button {

      width: 100%;

      border: none;

      background: transparent;

      text-align: left;

      padding: 12px 13px;

      margin-bottom: 4px;

      border-radius: 7px;

      color: #2d3748;

      font-size: 14px;

      cursor: pointer;

      transition: 0.15s;
    }


    .menu-button:hover {

      background: #edf2f7;
    }


    .menu-button.active {

      background: #4285f4;

      color: white;
    }


    /* ==============================
       RIGHT CONTENT
       ============================== */

    .content {

      flex: 1;

      height: 100%;

      background: #edf2f7;

      position: relative;

      overflow: hidden;
    }


    #welcome-screen {

      width: 100%;

      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      color: #718096;
    }


    #welcome-screen h2 {

      color: #2d3748;

      margin-bottom: 8px;
    }


    .app-frame {

      display: none;

      width: 100%;

      height: 100%;

      border: none;

      background: white;
    }


    /* ==============================
       LOADING
       ============================== */

    #loading {

      position: fixed;

      inset: 0;

      display: none;

      align-items: center;

      justify-content: center;

      background: rgba(255,255,255,0.85);

      z-index: 999;
    }


    .loading-box {

      padding: 25px 35px;

      background: white;

      border-radius: 12px;

      box-shadow: 0 5px 20px rgba(0,0,0,0.15);

      text-align: center;
    }

  </style>

</head>


<body>


<!-- =========================================
     LOGIN
     ========================================= -->

<div id="login-screen">

  <div class="login-card">

    <img
      src="https://raw.githubusercontent.com/zonemaster24/release/refs/heads/main/banner.png"
      class="login-banner"
      alt="My Dashboard"
    >

    <h2>My Dashboard</h2>

    <p id="login-message">
      Checking your Google Workspace account...
    </p>

    <div id="user-email"></div>

    <button
      id="login-button"
      disabled
      onclick="enterDashboard()">

      Checking Account...

    </button>

    <div id="status"></div>

    <div id="error"></div>

  </div>

</div>


<!-- =========================================
     DASHBOARD
     ========================================= -->

<div id="dashboard">

  <div class="dashboard-header">

    <div class="dashboard-title">
      My Dashboard
    </div>

    <div
      class="logged-user"
      id="header-user">
    </div>

  </div>


  <div class="dashboard-body">


    <!-- LEFT MENU -->

    <div class="sidebar">

      <div class="menu-title">
        Applications
      </div>


      <button
        class="menu-button"
        onclick="openApp(this, 'ADMIN_PORTAL_URL')">

        Admin Portal

      </button>


      <button
        class="menu-button"
        onclick="openApp(this, 'PARENT_EMAIL_URL')">

        Update Parent Email

      </button>


      <button
        class="menu-button"
        onclick="openApp(this, 'EMAIL_PHOTO_URL')">

        Update Email Photo

      </button>


      <button
        class="menu-button"
        onclick="openApp(this, 'EMAIL_GROUPS_URL')">

        Update Email Groups

      </button>


      <button
        class="menu-button"
        onclick="openApp(this, 'DELIVERY_NOTE_URL')">

        Delivery Note

      </button>


      <button
        class="menu-button"
        onclick="openApp(this, 'ID_PRINTING_URL')">

        ID Printing

      </button>


    </div>


    <!-- RIGHT CONTENT -->

    <div class="content">


      <div id="welcome-screen">

        <div>

          <h2>
            Welcome to My Dashboard
          </h2>

          <p>
            Select an application from the menu.
          </p>

        </div>

      </div>


      <iframe
        id="app-frame"
        class="app-frame"
        allow="camera; microphone">

      </iframe>


    </div>

  </div>

</div>


<!-- =========================================
     LOADING
     ========================================= -->

<div id="loading">

  <div class="loading-box">

    Loading...

  </div>

</div>



<script>


/* =========================================
   USER INFORMATION FROM CODE.GS
   ========================================= */

var isAuthenticated =
  <?!= isAuthenticated ? "true" : "false" ?>;

var userEmail =
  <?!= JSON.stringify(userEmail || "") ?>;



/* =========================================
   PAGE START
   ========================================= */

window.onload = function() {

  if (isAuthenticated && userEmail) {

    showAuthenticatedUser();

  } else {

    showNotAuthenticated();

  }

};



/* =========================================
   AUTHENTICATED USER
   ========================================= */

function showAuthenticatedUser() {

  document.getElementById("login-message").innerHTML =
    "You are signed in with your Google Workspace account.";

  document.getElementById("user-email").style.display =
    "block";

  document.getElementById("user-email").innerHTML =
    userEmail;

  document.getElementById("login-button").disabled =
    false;

  document.getElementById("login-button").innerHTML =
    "Enter Dashboard";

  document.getElementById("status").innerHTML =
    "Account verified.";

}



/* =========================================
   NOT AUTHENTICATED
   ========================================= */

function showNotAuthenticated() {

  document.getElementById("login-message").innerHTML =
    "Please sign in with your Google Workspace account.";

  document.getElementById("login-button").disabled =
    false;

  document.getElementById("login-button").innerHTML =
    "Sign in with Google";

  document.getElementById("status").innerHTML =
    "Google authentication is required.";

}



/* =========================================
   ENTER DASHBOARD
   ========================================= */

function enterDashboard() {

  /*
   * If Google has already authenticated the user,
   * open the dashboard.
   */

  if (isAuthenticated && userEmail) {

    document.getElementById("login-screen").style.display =
      "none";

    document.getElementById("dashboard").style.display =
      "block";

    document.getElementById("header-user").innerHTML =
      userEmail;

    return;
  }


  /*
   * If no email was detected, reload the Apps Script
   * web app so Google can perform authentication.
   */

  window.top.location.href =
    window.location.href;

}



/* =========================================
   OPEN APPLICATION
   ========================================= */

function openApp(button, url) {

  if (
    !url ||
    url === "ADMIN_PORTAL_URL" ||
    url === "PARENT_EMAIL_URL" ||
    url === "EMAIL_PHOTO_URL" ||
    url === "EMAIL_GROUPS_URL" ||
    url === "DELIVERY_NOTE_URL" ||
    url === "ID_PRINTING_URL"
  ) {

    alert(
      "Please replace the application URL in Index.html first."
    );

    return;
  }


  /* Remove active state */

  var buttons =
    document.querySelectorAll(".menu-button");

  buttons.forEach(function(btn) {

    btn.classList.remove("active");

  });


  /* Set active button */

  button.classList.add("active");


  /* Hide welcome */

  document.getElementById("welcome-screen").style.display =
    "none";


  /* Show iframe */

  var frame =
    document.getElementById("app-frame");

  frame.style.display =
    "block";

  frame.src =
    url;

}



/* =========================================
   LOADING HELPER
   ========================================= */

function showLoading() {

  document.getElementById("loading").style.display =
    "flex";

}


function hideLoading() {

  document.getElementById("loading").style.display =
    "none";

}

</script>


</body>

</html>
