<!DOCTYPE html>
<html>
<head>
    <title>My Dashboard</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: none; 
        }
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background-color: #f4f6f9;
        }
        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }
       .login-banner {
            width: 100%;
            max-height: 140px; /* Increased from 80px to make it bigger */
            object-fit: contain;
            margin-bottom: 20px;
        }
        h2 {
            margin-bottom: 10px;
            color: #333;
            font-size: 22px;
        }
        .btn-signin {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn-signin:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <!-- Login Screen Container -->
    <div id="login-screen">
        <div class="login-card">
            <img src="https://raw.githubusercontent.com/zonemaster24/release/refs/heads/main/banner.png" alt="Organization Banner" class="login-banner">
            <h2>Restricted Access</h2>
            <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Please authenticate with your organizational Google account to load your dashboard.</p>
            
            <button class="btn-signin" onclick="authenticateUser()">Sign In via Google</button>
        </div>
    </div>

    <!-- Dashboard Iframe (Hidden initially) -->
    <iframe id="dashboard-frame" src="https://script.google.com/macros/s/AKfycbxng3MpF1aMIhXiTST7ySDn84OYSlVNV7hDo2rnu8exyRcn3H5roUGkztiV1IugDPQ/exec"></iframe>

    <script>
        function authenticateUser() {
            // Call backend to verify credentials/session
            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.authorized) {
                        // Hide login screen and display dashboard
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('dashboard-frame').style.display = 'block';
                    } else {
                        alert("Access denied. Please ensure you are logged into your authorized organizational account.");
                    }
                })
                .withFailureHandler(function(error) {
                    alert("Authentication failed: " + error.message);
                })
                .checkUserAccess();
        }
    </script>

</body>
</html>
