<!DOCTYPE html>
<html>
<head>
    <title>My Dashboard</title>
    <!-- Load Google Identity Services library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: none; /* Hidden until login */
        }
        /* Login Screen Styling */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background-color: #f4f6f9;
        }
        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        .login-banner {
            width: 100%;
            max-height: 80px;
            object-fit: contain;
            margin-bottom: 20px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 22px;
        }
    </style>
</head>
<body>

    <!-- Login Screen Container -->
    <div id="login-screen">
        <div class="login-card">
            <img src="https://raw.githubusercontent.com/zonemaster24/release/refs/heads/main/banner.png" alt="Organization Banner" class="login-banner">
            <h2>Sign In</h2>
            <p style="color: #666; font-size: 14px; margin-bottom: 25px;">Please sign in with your organizational Google account to access your dashboard.</p>
            
            <!-- Google Sign-In Button Container -->
            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="sign_in_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>
    </div>

    <!-- Dashboard Iframe (Hidden initially) -->
    <iframe id="dashboard-frame" src="https://script.google.com/macros/s/AKfycbxng3MpF1aMIhXiTST7ySDn84OYSlVNV7hDo2rnu8exyRcn3H5roUGkztiV1IugDPQ/exec"></iframe>

    <script>
        function handleCredentialResponse(response) {
            // Decoding the JWT token to verify user info if needed
            console.log="Encoded JWT ID token: " + response.credential;
            
            // Hide login screen and show the dashboard iframe
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard-frame').style.display = 'block';
        }
    </script>

</body>
</html>
