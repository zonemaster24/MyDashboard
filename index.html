<!DOCTYPE html>
<html>
<head>
    <title>My Dashboard</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #edf2f7; 
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: none; 
        }
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            position: relative;
        }
        .login-card {
            background: #ffffff;
            padding: 40px;
            padding-top: 110px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 380px;
            width: 80%;
            position: relative;
            margin-top: 50px;
        }
        .login-banner {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: -85px; 
            width: 160px; 
            height: 160px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #ffffff;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            z-index: 10;
        }
        h2 {
            margin: 0 0 10px 0;
            color: #1a202c;
            font-size: 24px;
            font-weight: 600;
        }
        p {
            color: #718096;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn-signin {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(66, 133, 244, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-signin:hover {
            background-color: #357ae8;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <img src="https://raw.githubusercontent.com/zonemaster24/release/refs/heads/main/banner.png" alt="Mr. Renzo Banner" class="login-banner">
            <h2>Restricted Access</h2>
            <p>Please sign in with your Google account to access your dashboard.</p>
            
            <button class="btn-signin" onclick="handleLogin()">
                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#ffffff" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.85 2.08-1.81 2.72v2.26h2.92c1.71-1.57 2.69-3.88 2.69-6.63z"/><path fill="#ffffff" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.95v2.33C2.43 15.98 5.48 18 9 18z"/><path fill="#ffffff" d="M3.97 10.71c-.18-.54-.28-1.12-.28-1.71s.1-1.17.28-1.71V4.96H.95C.35 6.15 0 7.52 0 9s.35 2.85.95 4.04l3.02-2.33z"/><path fill="#ffffff" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.43 2.02.95 4.96l3.02 2.33c.71-2.13 2.69-3.71 5.03-3.71z"/></svg>
                Sign In with Google
            </button>
        </div>
    </div>

    <iframe id="dashboard-frame" src="https://script.google.com/macros/s/AKfycbxng3MpF1aMIhXiTST7ySDn84OYSlVNV7hDo2rnu8exyRcn3H5roUGkztiV1IugDPQ/exec"></iframe>

    <script>
        function handleLogin() {
            google.script.run
                .withSuccessHandler(function(response) {
                    if (response && response.success) {
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('dashboard-frame').style.display = 'block';
                    }
                })
                .withFailureHandler(function(error) {
                    alert("Authorization popup was blocked or permission was denied. Please allow popups for this site and try again.");
                })
                .verifyLogin();
        }
    </script>

</body>
</html>
