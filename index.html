<!DOCTYPE html>
<html>
<head>
    <title>My Dashboard</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #edf2f7; 
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: <?= isAuthenticated ? 'block' : 'none' ?>; 
        }
        #login-screen {
            display: <?= isAuthenticated ? 'none' : 'flex' ?>;
            align-items: center;
            justify-content: center;
            height: 100%;
            position: relative;
        }
        .login-card {
            background: #ffffff;
            padding: 40px;
            padding-top: 110px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 380px;
            width: 80%;
            position: relative;
            margin-top: 50px;
        }
        .login-banner {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: -85px; 
            width: 160px; 
            height: 160px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #ffffff;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            z-index: 10;
        }
        h2 {
            margin: 0 0 10px 0;
            color: #1a202c;
            font-size: 24px;
            font-weight: 600;
        }
        p {
            color: #718096;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn-signin {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(66, 133, 244, 0.3);
            box-sizing: border-box;
        }
        .btn-signin:hover {
            background-color: #357ae8;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <img src="https://raw.githubusercontent.com/zonemaster24/release/refs/heads/main/banner.png" alt="Mr. Renzo Banner" class="login-banner">
            <h2>Restricted Access</h2>
            <p>Please sign in with your Google account to access your dashboard.</p>
            
            <!-- Clicking this forces Google's native authorization window redirect -->
            <a href="<?!= ScriptApp.getService().getUrl() ?>" class="btn-signin">Sign In with Google</a>
        </div>
    </div>

    <iframe id="dashboard-frame" src="https://script.google.com/macros/s/AKfycbxng3MpF1aMIhXiTST7ySDn84OYSlVNV7hDo2rnu8exyRcn3H5roUGkztiV1IugDPQ/exec"></iframe>

</body>
</html>
