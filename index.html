<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Dashboard</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: #050816;

      position: relative;
    }


    /* =========================================================
       ANIMATED NEON BACKGROUND
       ========================================================= */

    .background-effects {
      position: fixed;
      inset: 0;

      overflow: hidden;
      pointer-events: none;

      z-index: 0;
    }


    /* Floating glowing orbs */

    .orb {
      position: absolute;

      width: 350px;
      height: 350px;

      border-radius: 50%;

      filter: blur(60px);

      opacity: 0.45;

      animation:
        floatOrb 14s ease-in-out infinite alternate;
    }


    .orb-1 {
      top: -120px;
      left: -120px;

      background: #00e5ff;

      animation-duration: 13s;
    }


    .orb-2 {
      top: 5%;
      right: -150px;

      background: #7b2cff;

      animation-duration: 16s;
      animation-delay: -5s;
    }


    .orb-3 {
      bottom: -180px;
      left: 15%;

      background: #0066ff;

      animation-duration: 18s;
      animation-delay: -8s;
    }


    .orb-4 {
      right: 15%;
      bottom: -200px;

      background: #00ffae;

      animation-duration: 14s;
      animation-delay: -3s;
    }


    @keyframes floatOrb {

      0% {
        transform:
          translate(0, 0)
          scale(1);
      }

      50% {
        transform:
          translate(140px, 100px)
          scale(1.25);
      }

      100% {
        transform:
          translate(-100px, 180px)
          scale(0.9);
      }

    }


    /* =========================================================
       MOVING CYBER GRID
       ========================================================= */

    .background-grid {
      position: fixed;

      inset: -100px;

      pointer-events: none;

      z-index: 1;

      background-image:
        linear-gradient(
          rgba(0, 229, 255, 0.07) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(0, 229, 255, 0.07) 1px,
          transparent 1px
        );

      background-size:
        50px 50px;

      transform:
        perspective(600px)
        rotateX(60deg);

      transform-origin:
        center bottom;

      animation:
        moveGrid 8s linear infinite;
    }


    @keyframes moveGrid {

      from {
        background-position:
          0 0;
      }

      to {
        background-position:
          0 50px;
      }

    }


    /* =========================================================
       FLOATING PARTICLES
       ========================================================= */

    .particles {
      position: fixed;

      inset: 0;

      pointer-events: none;

      z-index: 2;

      overflow: hidden;
    }


    .particles span {
      position: absolute;

      width: 4px;
      height: 4px;

      border-radius: 50%;

      background: #00e5ff;

      box-shadow:
        0 0 8px #00e5ff,
        0 0 15px #00e5ff;

      animation:
        particleFloat 8s linear infinite;
    }


    .particles span:nth-child(1) {
      left: 10%;
      animation-delay: 0s;
      animation-duration: 9s;
    }

    .particles span:nth-child(2) {
      left: 25%;
      animation-delay: -3s;
      animation-duration: 12s;
    }

    .particles span:nth-child(3) {
      left: 40%;
      animation-delay: -7s;
      animation-duration: 10s;
    }

    .particles span:nth-child(4) {
      left: 55%;
      animation-delay: -2s;
      animation-duration: 14s;
    }

    .particles span:nth-child(5) {
      left: 70%;
      animation-delay: -9s;
      animation-duration: 11s;
    }

    .particles span:nth-child(6) {
      left: 82%;
      animation-delay: -4s;
      animation-duration: 13s;
    }

    .particles span:nth-child(7) {
      left: 92%;
      animation-delay: -6s;
      animation-duration: 10s;
    }

    .particles span:nth-child(8) {
      left: 48%;
      animation-delay: -11s;
      animation-duration: 15s;
    }


    @keyframes particleFloat {

      0% {
        transform:
          translateY(110vh)
          scale(0.4);

        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      85% {
        opacity: 1;
      }

      100% {
        transform:
          translateY(-10vh)
          translateX(80px)
          scale(1.4);

        opacity: 0;
      }

    }


    /* =========================================================
       LOGIN CARD
       ========================================================= */

    .login-card {
      width: 475px;
      max-width: 90%;

      padding:
        135px 40px 42px;

      border-radius: 24px;

      text-align: center;

      position: relative;

      z-index: 10;

      background:
        rgba(8, 15, 35, 0.82);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      border:
        1px solid
        rgba(0, 229, 255, 0.45);

      box-shadow:
        0 0 15px rgba(0, 229, 255, 0.30),
        0 0 40px rgba(0, 229, 255, 0.14),
        0 0 80px rgba(151, 71, 255, 0.15),
        0 25px 70px rgba(0, 0, 0, 0.50);

      animation:
        cardGlow 3s ease-in-out infinite alternate;
    }


    @keyframes cardGlow {

      from {
        box-shadow:
          0 0 15px rgba(0, 229, 255, 0.25),
          0 0 35px rgba(0, 229, 255, 0.10),
          0 0 70px rgba(151, 71, 255, 0.12),
          0 25px 70px rgba(0, 0, 0, 0.50);
      }

      to {
        box-shadow:
          0 0 25px rgba(0, 229, 255, 0.50),
          0 0 55px rgba(0, 229, 255, 0.20),
          0 0 90px rgba(151, 71, 255, 0.25),
          0 25px 70px rgba(0, 0, 0, 0.55);
      }

    }


    .login-card::before {
      content: "";

      position: absolute;

      top: 0;
      left: 12%;
      right: 12%;

      height: 2px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #00e5ff,
          #9b5cff,
          #00e5ff,
          transparent
        );

      box-shadow:
        0 0 12px #00e5ff,
        0 0 25px #9b5cff;

      border-radius: 50%;
    }


    /* =========================================================
       PROFILE IMAGE
       ========================================================= */

    .login-banner {
      position: absolute;

      width: 190px;
      height: 190px;

      left: 50%;
      top: -95px;

      transform:
        translateX(-50%);

      object-fit: cover;

      border-radius: 50%;

      border:
        4px solid #00e5ff;

      padding: 4px;

      background: #07101f;

      box-shadow:
        0 0 12px #00e5ff,
        0 0 30px rgba(0, 229, 255, 0.75),
        0 0 60px rgba(151, 71, 255, 0.40);

      animation:
        imageGlow 2.5s ease-in-out infinite alternate;
    }


    @keyframes imageGlow {

      from {
        box-shadow:
          0 0 12px #00e5ff,
          0 0 25px rgba(0, 229, 255, 0.60),
          0 0 50px rgba(151, 71, 255, 0.25);
      }

      to {
        box-shadow:
          0 0 20px #00e5ff,
          0 0 45px rgba(0, 229, 255, 0.90),
          0 0 75px rgba(151, 71, 255, 0.60);
      }

    }


    /* =========================================================
       TEXT
       ========================================================= */

    h2 {
      margin: 0 0 14px;

      color: #f7fbff;

      font-size: 34px;
      font-weight: 700;

      letter-spacing: 0.5px;

      text-shadow:
        0 0 10px rgba(0, 229, 255, 0.45);
    }


    .neon-title {
      color: #00e5ff;

      text-shadow:
        0 0 8px #00e5ff,
        0 0 20px rgba(0, 229, 255, 0.70);
    }


    p {
      color: #9eabc0;

      font-size: 16px;

      margin: 0 0 32px;

      line-height: 1.6;
    }


    /* =========================================================
       BUTTON
       ========================================================= */

    .btn-signin {
      width: 100%;

      padding: 16px 20px;

      border:
        1px solid rgba(0, 229, 255, 0.80);

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #006d9c,
          #0066cc,
          #6b35d9
        );

      color: #ffffff;

      font-size: 17px;
      font-weight: 700;

      letter-spacing: 0.3px;

      cursor: pointer;

      position: relative;

      overflow: hidden;

      box-shadow:
        0 0 12px rgba(0, 229, 255, 0.35),
        inset 0 0 15px rgba(255, 255, 255, 0.08);

      transition:
        transform 0.2s,
        box-shadow 0.2s,
        filter 0.2s;
    }


    .btn-signin::before {
      content: "";

      position: absolute;

      top: 0;
      left: -100%;

      width: 60%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.35),
          transparent
        );

      transform:
        skewX(-25deg);

      transition:
        left 0.6s ease;
    }


    .btn-signin:hover {
      transform:
        translateY(-3px);

      filter:
        brightness(1.15);

      box-shadow:
        0 0 18px rgba(0, 229, 255, 0.70),
        0 0 45px rgba(151, 71, 255, 0.35),
        inset 0 0 15px rgba(255,255,255,0.10);
    }


    .btn-signin:hover::before {
      left: 150%;
    }


    .btn-signin:active {
      transform:
        translateY(0);
    }


    .btn-signin:disabled {
      cursor: wait;
      opacity: 0.75;
      transform: none;
    }


    /* =========================================================
       STATUS
       ========================================================= */

    .status {
      margin-top: 20px;

      color: #00e5ff;

      font-size: 13px;
      font-weight: 600;

      letter-spacing: 0.5px;

      display: none;

      text-shadow:
        0 0 8px rgba(0, 229, 255, 0.70);
    }


    .status::before {
      content: "●";

      margin-right: 8px;

      animation:
        blink 1s infinite;
    }


    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.25;
      }

    }


    .security-text {
      margin-top: 22px;

      font-size: 11px;

      color:
        rgba(158, 171, 192, 0.65);

      letter-spacing: 1.2px;

      text-transform:
        uppercase;
    }


    .security-text span {
      color: #00e5ff;

      text-shadow:
        0 0 8px #00e5ff;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media(max-width: 600px) {

      .login-card {
        width: 90%;

        padding:
          125px 25px 35px;
      }


      .login-banner {
        width: 160px;
        height: 160px;

        top: -80px;
      }


      h2 {
        font-size: 28px;
      }


      p {
        font-size: 15px;
      }


      .orb {
        width: 250px;
        height: 250px;
      }

    }

  </style>

</head>

<body>


  <!-- Animated Background -->

  <div class="background-effects">

    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="orb orb-4"></span>

  </div>


  <div class="background-grid"></div>


  <div class="particles">

    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>

  </div>


  <!-- Login Card -->

  <div class="login-card">

    <img
      src="https://raw.githubusercontent.com/zonemaster24/release/refs/heads/main/banner.png"
      alt="My Dashboard"
      class="login-banner"
    >


    <h2>
      MY <span class="neon-title">DASHBOARD</span>
    </h2>


    <p>
      Click below to launch your secure dashboard session.
    </p>


    <button
      class="btn-signin"
      id="signinButton"
      onclick="openDashboard()">

      Sign in with Google

    </button>


    <div
      id="status"
      class="status">

      Opening secure dashboard...

    </div>


    <div class="security-text">

      <span>●</span> Secure Workspace Access

    </div>

  </div>


  <script>

    const DASHBOARD_URL =
      "https://script.google.com/a/macros/djis.edu.sa/s/AKfycbz3GwKtNNRoe7PoEm7EvPhwVwyelR7lFzGwA7D2MCXi9B40oFe0DzZI4ODhvQsHEuJd/exec";


    function openDashboard() {

      const button =
        document.getElementById(
          "signinButton"
        );

      const status =
        document.getElementById(
          "status"
        );


      button.disabled = true;

      button.innerHTML =
        "Opening Dashboard...";


      status.style.display =
        "block";


      window.location.assign(
        DASHBOARD_URL
      );

    }

  </script>

</body>
</html>
