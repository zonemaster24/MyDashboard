<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Dashboard</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {

      font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

      background: #edf2f7;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;
    }


    .login-card {

      background: #ffffff;

      width: 475px;

      max-width: 90%;

      padding: 40px;

      padding-top: 135px;

      border-radius: 20px;

      text-align: center;

      position: relative;

      box-shadow:
        0 15px 40px rgba(0,0,0,0.12);
    }


    .login-banner {

      position: absolute;

      width: 190px;

      height: 190px;

      left: 50%;

      top: -95px;

      transform: translateX(-50%);

      object-fit: cover;

      border-radius: 50%;

      border: 6px solid #ffffff;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.18);
    }


    h2 {

      margin: 0 0 12px;

      color: #12345b;

      font-size: 32px;

      font-weight: 600;
    }


    p {

      color: #718096;

      font-size: 17px;

      margin: 0 0 30px;

      line-height: 1.5;
    }


    .btn-signin {

      width: 100%;

      padding: 15px 20px;

      border: none;

      border-radius: 9px;

      background: #4285f4;

      color: white;

      font-size: 17px;

      font-weight: 600;

      cursor: pointer;

      box-shadow:
        0 4px 8px rgba(66,133,244,0.25);

      transition:
        background 0.2s,
        transform 0.2s;
    }


    .btn-signin:hover {

      background: #357ae8;

      transform: translateY(-1px);
    }


    .btn-signin:active {

      transform: translateY(0);
    }


    .status {

      margin-top: 18px;

      color: #718096;

      font-size: 13px;

      display: none;
    }


    @media(max-width: 600px) {

      .login-card {

        width: 90%;

        padding-left: 25px;

        padding-right: 25px;
      }

      h2 {

        font-size: 26px;
      }

    }

  </style>

</head>


<body>


  <div class="login-card">

    <img
      src="https://raw.githubusercontent.com/zonemaster24/release/refs/heads/main/banner.png"
      alt="Mr. Renz"
      class="login-banner"
    >


    <h2>
      My Dashboard
    </h2>


    <p>
      Click below to launch your secure dashboard session.
    </p>


    <button
      class="btn-signin"
      onclick="openDashboard()">

      Sign in with Google

    </button>


    <div
      id="status"
      class="status">

      Opening secure dashboard...

    </div>

  </div>


  <script>

    /*
     * YOUR APPS SCRIPT WEB APP
     *
     * Replace this URL with the /exec URL
     * of your MyDashboard Apps Script.
     */

    const DASHBOARD_URL =
      "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";


    function openDashboard() {

      const button =
        document.querySelector(".btn-signin");

      const status =
        document.getElementById("status");


      button.disabled = true;

      button.innerHTML =
        "Opening Dashboard...";

      status.style.display =
        "block";


      /*
       * IMPORTANT:
       *
       * Do NOT put the Apps Script inside an iframe
       * on this GitHub page.
       *
       * Navigate directly to the Apps Script URL.
       */

      window.location.href =
        DASHBOARD_URL;

    }

  </script>


</body>

</html>
