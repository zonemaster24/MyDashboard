<!DOCTYPE html>
<html>
<head>
    <title>My Dashboard</title>
    <style>
        /* Basic Page Reset and Font */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #edf2f7; 
        }

        /* The Dashboard Iframe (Hidden until login) */
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: none; 
        }

        /* Login Screen Container: Centered */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            position: relative;
        }

        /* The Main White Card */
        .login-card {
            background: #ffffff;
            padding: 40px;
            padding-top: 110px; /* Space for the larger overlapping image */
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 380px;
            width: 80%;
            position: relative;
            margin-top: 50px;
        }

        /* The Banner Image Styling (Larger, circular with white border ring) */
        .login-banner {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: -85px; 
            width: 160px; 
            height: 160px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #ffffff;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            z-index: 10;
        }

        /* Text Styling */
        h2 {
            margin: 0 0 10px 0;
            color: #1a202c;
            font-size: 24px;
            font-weight: 600;
        }
        p {
            color: #718096;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* Blue Sign-In Button */
        .btn-signin {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px rgba(49, 130, 206, 0.3);
        }
        .btn-signin:hover {
            background-color: #2c5282;
        }
        .btn-signin:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <!-- Login Screen Container -->
    <div id="login-screen">
        <div class="login-card">
            <!-- Overlapping Image -->
            <img src="https://raw.githubusercontent.com/zonemaster24/release/refs/heads/main/banner.png" alt="Mr. Renzo Banner" class="login-banner">
            
            <!-- Text Content -->
           
            <!-- Sign-In Button -->
            <button class="btn-signin" onclick="authenticateUser()">Sign In via Google</button>
        </div>
    </div>

    <!-- Dashboard Iframe (Hidden initially) -->
    <iframe id="dashboard-frame" src="https://script.google.com/macros/s/AKfycbxng3MpF1aMIhXiTST7ySDn84OYSlVNV7hDo2rnu8exyRcn3H5roUGkztiV1IugDPQ/exec"></iframe>

    <script>
        function authenticateUser() {
            google.script.run
                .withSuccessHandler(function(result) {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('dashboard-frame').style.display = 'block';
                })
                .withFailureHandler(function(error) {
                    alert("Authentication failed. Please ensure you are logged in correctly.");
                    console.error(error);
                })
                .getSessionEmail(); 
        }
    </script>

</body>
</html>
